# State of the Art of WebAI: layers, groups and chips. Format: SPEC.md (version 0.4); schema: schema/layers.schema.json
# Texts live in i18n/<lang>.yml keyed by id. Every chip has `sources`: at least two distinct links, optionally grouped by label.
# A chip may have an `alert` (a dated, evidenced problem; SPEC.md section 4.5), separate from `status`, and `featured: false`
# (not drawn on the figure; listed in the README under 'Also exists').

spec: "0.4"
layers:
  - id: choose
    n: 1
    icon: model
    column: left
    layout: cols
    groups:
      - id: start
        col: 0
        chips:
          - id: open-weights
            sources:
              - url: https://huggingface.co/HuggingFaceTB/SmolLM3-3B
                accessed: "2026-11-19"
                level: primary
                title: "SmolLM3-3B model card"
                group: docs
              - url: https://huggingface.co/blog/smollm3
                accessed: "2026-11-20"
                level: trusted
                title: "Hugging Face: SmolLM3 announcement"
                group: blog
          - id: short-context
            sources:
              - url: https://huggingface.co/blog/kv-cache-quantization
                accessed: "2026-11-19"
                level: trusted
                title: "Hugging Face: KV cache quantization"
                group: blog
              - url: https://developer.nvidia.com/blog/mastering-llm-techniques-inference-optimization/
                accessed: "2026-11-20"
                level: trusted
                title: "NVIDIA: LLM inference optimization"
                group: blog
      - id: adapt
        col: 1
        chips:
          - id: lora
            sources:
              - url: https://arxiv.org/abs/2106.09685
                accessed: "2026-11-19"
                level: primary
                title: "LoRA paper"
                group: papers
              - url: https://github.com/microsoft/LoRA
