# State of the Art of WebAI: layers, groups and chips. Format: SPEC.md (version 0.1); schema: schema/layers.schema.json
# Texts live in i18n/<lang>.yml keyed by id. Every chip has `source` (one link) or `sources` (a tree of two or more).

spec: "0.1"
layers:
  - id: choose
    n: 1
    icon: model
    column: left
    layout: cols
    groups:
      - id: start
        col: 0
        chips:
          - id: open-weights
            source:
              url: https://huggingface.co/HuggingFaceTB/SmolLM3-3B
              accessed: "2026-11-19"
              level: primary
              title: "SmolLM3-3B model card"
          - id: short-context
            source:
              url: https://huggingface.co/blog/kv-cache-quantization
              accessed: "2026-11-19"
              level: trusted
              title: "Hugging Face: KV cache quantization"
      - id: adapt
        col: 1
        chips:
          - id: lora
            source:
              url: https://arxiv.org/abs/2106.09685
              accessed: "2026-11-19"
              level: primary
              title: "LoRA paper"
          - id: qlora
            source:
              url: https://arxiv.org/abs/2305.14314
              accessed: "2026-11-19"
              level: primary
              title: "QLoRA paper"
          - id: distillation
            sources:
              - url: https://arxiv.org/abs/1503.02531
                accessed: "2026-11-19"
                level: primary
                title: "Distilling the knowledge in a neural network"
                group: papers
              - url: https://arxiv.org/abs/1910.01108
                accessed: "2026-11-19"
                level: primary
                title: "DistilBERT"
                group: papers
  - id: convert
    n: 2
    icon: bits
    column: left
    layout: cols
    groups:
      - id: format
        col: 0
        chips:
          - id: onnx
            source:
              url: https://onnxruntime.ai/docs/tutorials/web/
              accessed: "2026-11-19"
              level: primary
              title: "ONNX Runtime Web: tutorials"
          - id: gguf
            source:
              url: https://github.com/ggml-org/ggml/blob/master/docs/gguf.md
              accessed: "2026-11-19"
              level: primary
              title: "GGUF specification"
          - id: mlc-format
            source:
              url: https://github.com/mlc-ai/web-llm
              accessed: "2026-11-19"
              level: primary
              title: "WebLLM README"
          - id: tflite
            source:
              url: https://ai.google.dev/edge/litert
              accessed: "2026-11-19"
              level: primary
              title: "LiteRT documentation"
          - id: coreml-format
            source:
              url: https://developer.apple.com/documentation/coreml
              accessed: "2026-11-19"
              level: primary
              title: "Apple: Core ML"
      - id: precision
        col: 0
        chips:
          - id: fp32
            source:
              url: https://cloud.google.com/blog/products/ai-machine-learning/bfloat16-the-secret-to-high-performance-on-cloud-tpus
              accessed: "2026-11-19"
              level: trusted
              title: "Google Cloud: bfloat16"
          - id: fp16
            source:
              url: https://en.wikipedia.org/wiki/Half-precision_floating-point_format
              accessed: "2026-11-19"
              level: trusted
              title: "Wikipedia: half-precision"
          - id: bf16
            source:
              url: https://cloud.google.com/blog/products/ai-machine-learning/bfloat16-the-secret-to-high-performance-on-cloud-tpus
              accessed: "2026-11-19"
              level: trusted
              title: "Google Cloud: bfloat16"
          - id: int8
            source:
              url: https://onnxruntime.ai/docs/performance/model-optimizations/quantization.html
              accessed: "2026-11-19"
              level: primary
              title: "ONNX Runtime: quantization"
          - id: int4
            source:
              url: https://onnxruntime.ai/docs/performance/model-optimizations/quantization.html
