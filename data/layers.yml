                level: primary
                title: "QLoRA paper"
                group: papers
              - url: https://github.com/artidoro/qlora
                accessed: "2026-11-20"
                level: primary
                title: "QLoRA reference code"
                group: code
          - id: distillation
            sources:
              - url: https://arxiv.org/abs/1503.02531
                accessed: "2026-11-19"
                level: primary
                title: "Distilling the knowledge in a neural network"
                group: papers
              - url: https://arxiv.org/abs/1910.01108
                accessed: "2026-11-19"
                level: primary
                title: "DistilBERT"
                group: papers
