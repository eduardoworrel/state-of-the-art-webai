name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data and translations against the spec
        run: python3 scripts/check.py
      - name: Rebuild the page and the awesome lists
        run: python3 build.py
      - name: The committed outputs must be up to date
        run: git diff --exit-code docs/index.html README.md README.pt.md
