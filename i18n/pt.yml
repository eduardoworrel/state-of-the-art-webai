alert.onnxruntime: "Em 2026-11-20 github.com/microsoft/onnxruntime responde 404, na web e na API do GitHub; o mesmo vale para onnxruntime-genai e onnxruntime-extensions. O PyPI onnxruntime 1.32.0 (2026-11-13), o npm onnxruntime-web 1.31.1 e o onnxruntime.ai ainda apontam para esse endereço. Não achei endereço novo: github.com/onnxruntime/onnxruntime também responde 404. O site da documentação e os registros de pacotes ainda respondem."
alert.ort-web: "Em 2026-11-20 o repositório que o npm lista para o onnxruntime-web 1.31.1 (publicado em 2026-10-26), github.com/Microsoft/onnxruntime, responde 404, na web e na API do GitHub. Não achei endereço novo. O site da documentação e o registro do npm ainda respondem."
alert.mediapipe: "A página oficial da LLM Inference API, arquivada em 2026-05-17, diz que as implementações de Android e iOS estão descontinuadas, que a Web não está, e pede que projetos móveis migrem para o LiteRT-LM. No arquivo o aviso não aparece em 2026-03-30 e aparece em 2026-04-05. Em 2026-11-20 o endereço da página redireciona (301) para a página do LiteRT-LM."
