group.export-tools: "Exportar com"
ui.also: "Também existe (fora da figura)"
chip.ort-genai: "ONNX Runtime GenAI"
desc.ort-genai: "O laço de geração para modelos ONNX: tokenização, busca e amostragem, cache KV e uma API generate(), em prévia."
chip.litert-lm-runtime: "LiteRT-LM"
desc.litert-lm-runtime: "Camada de orquestração do Google para rodar LLMs com o LiteRT: multiplataforma, com CLI e APIs em Python, Kotlin, Swift, Web e C++."
chip.mnn-llm: "MNN-LLM"
desc.mnn-llm: "O módulo de LLM do motor MNN, da Alibaba: exporta modelos do PyTorch para o MNN e gera texto; o MNN traz apps de chat para Android."
chip.executorch-llm: "ExecuTorch LLM"
desc.executorch-llm: "Blocos do ExecuTorch para LLMs locais: texto quantizado, contexto longo, chamada de ferramentas, decodificação especulativa, servidor local."
chip.candle: "Candle"
desc.candle: "Framework de ML minimalista em Rust da Hugging Face; as demos online rodam geração de texto com LLaMA2 e T5 inteiramente no navegador."
chip.burn: "Burn"
desc.burn: "Framework de aprendizado profundo em Rust cujos backends incluem WebGPU e uma CPU no_std."
chip.optimum: "Optimum"
desc.optimum: "Kit da Hugging Face para exportar e otimizar modelos; a documentação do Transformers.js o recomenda para converter do PyTorch para ONNX."
chip.olive: "Olive"
desc.olive: "Kit da Microsoft para o ONNX Runtime: conversão, quantização e otimização de modelos para CPUs, GPUs e NPUs."
chip.ort-genai-builder: "GenAI Model Builder"
desc.ort-genai-builder: "A ferramenta do ONNX Runtime GenAI que monta um modelo ONNX para a API generate() a partir de pesos da Hugging Face, na precisão escolhida."
chip.mlc-compile: "MLC compile"
desc.mlc-compile: "Converte os pesos para o formato MLC e compila a biblioteca do modelo para a plataforma de destino."
chip.litert-torch: "litert-torch"
desc.litert-torch: "Converte modelos do PyTorch para o LiteRT, para inferência no aparelho."
chip.coremltools-export: "coremltools"
desc.coremltools-export: "Ferramentas da Apple para converter e editar modelos para o Core ML, com quantização de pesos e ativações."
chip.executorch-export: "ExecuTorch export"
desc.executorch-export: "Captura um modelo do PyTorch com torch.export, otimiza para o hardware de destino e gera um programa ExecuTorch."
chip.llama-quantize: "llama.cpp quantize"
desc.llama-quantize: "Pega um modelo GGUF em alta precisão (F32, BF16) e o converte para um tipo quantizado; um arquivo imatrix pode limitar a perda de precisão."
chip.autogptq: "AutoGPTQ"
desc.autogptq: "Pacote de quantização GPTQ; o README diz que está sem manutenção e sugere o GPTQModel, e o repositório está arquivado."
chip.autoawq: "AutoAWQ"
desc.autoawq: "Pacote de quantização AWQ; o README diz que está oficialmente descontinuado e aponta para o llm-compressor."
chip.llm-compressor: "llm-compressor"
desc.llm-compressor: "Biblioteca do projeto vLLM para comprimir LLMs para inferência em produção; o README do AutoAWQ diz que o vLLM o adotou ali."
chip.bitsandbytes: "bitsandbytes"
desc.bitsandbytes: "Quantização em k bits para o PyTorch, com os tipos de 8 e 4 bits (NF4) que o QLoRA usa."
chip.torchao: "torchao"
desc.torchao: "Quantização e otimização de treino nativas do PyTorch; o README diz que o desenvolvimento de novas funções está sendo minimizado."
alert.ort-genai: "Em 2026-11-20 github.com/microsoft/onnxruntime-genai responde 404, na web e na API do GitHub, como os outros repositórios do ONNX Runtime. A documentação em onnxruntime.ai ainda aponta para ele e diz que a API está em prévia; o PyPI onnxruntime-genai 0.20.0 (2026-11-14) ainda responde. Não achei endereço novo."
alert.ort-genai-builder: "Em 2026-11-20 a página \"Generate models using Model Builder\" só aponta para o guia do model builder em github.com/microsoft/onnxruntime-genai, que responde 404 (o repositório inteiro responde, na web e na API do GitHub). O tutorial do Phi-2 em onnxruntime.ai ainda descreve o comando do builder. Não achei endereço novo."
alert.olive: "Em 2026-11-20 github.com/microsoft/Olive responde 404, na web e na API do GitHub. O site da documentação microsoft.github.io/Olive e o PyPI olive-ai 0.13.0 (2026-06-09) ainda respondem, e o PyPI ainda aponta para esse repositório. Não achei endereço novo."
alert.optimum: "O README do Optimum, lido em 2026-11-20, diz que a integração com ONNX foi movida para o optimum-onnx, que tem instruções de instalação próprias."
alert.litert-torch: "Em 2026-11-20 github.com/google-ai-edge/ai-edge-torch redireciona (301) para github.com/google-ai-edge/litert-torch."
alert.autogptq: "O README do AutoGPTQ, lido em 2026-11-20, começa com: “AutoGPTQ is unmaintained - we suggest using GPTQModel for bug fixes and new models support”. A API do GitHub informa o repositório como arquivado (último push em 2025-04-11)."
alert.autoawq: "O README do AutoAWQ, lido em 2026-11-20, diz: “AutoAWQ is officially deprecated and will no longer be maintained.” e que o projeto vLLM o adotou como llm-compressor. A API do GitHub informa o repositório como arquivado (último push em 2025-05-11)."
