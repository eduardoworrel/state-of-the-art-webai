layer.choose: "Escolher e adaptar"
decision.choose: "Qual tarefa e qual base?"
group.start: "Ponto de partida"
chip.open-weights: "pesos abertos"
desc.open-weights: "Pesos publicados abertamente, que podem ser adaptados, convertidos e distribuídos; o SmolLM3-3B é Apache-2.0."
chip.short-context: "contexto curto"
desc.short-context: "Contexto curto mantém o cache KV pequeno; o cache cresce a cada token guardado."
group.adapt: "Adaptar"
chip.lora: "LoRA"
desc.lora: "Congela os pesos base e treina pequenas matrizes de baixo posto, sem latência extra na inferência."
chip.qlora: "QLoRA"
desc.qlora: "LoRA sobre um modelo congelado em 4 bits; ajusta um modelo de 65B numa única GPU de 48 GB."
chip.distillation: "destilação"
desc.distillation: "Espreme um modelo maior num menor; o DistilBERT é 40% menor e 60% mais rápido."
layer.convert: "Converter e quantizar"
decision.convert: "Qual precisão?"
group.format: "Formato"
chip.onnx: "ONNX"
desc.onnx: "Formato aberto de grafo que o ONNX Runtime executa no navegador e em plataformas nativas."
chip.gguf: "GGUF"
desc.gguf: "Formato de arquivo para runtimes baseados em GGML, feito para carregar rápido com mmap."
chip.mlc-format: "MLC"
desc.mlc-format: "Empacotamento de modelo usado pelo MLC e pelo WebLLM para rodar em WebGPU."
chip.tflite: ".tflite"
desc.tflite: "Formato de modelo do LiteRT, antigo TensorFlow Lite, para inferência no aparelho."
chip.litertlm-format: ".litertlm"
desc.litertlm-format: "Contêiner do LiteRT para LLMs: um modelo .tflite empacotado com o seu tokenizador."
chip.tfjs-format: "TF.js model.json"
desc.tfjs-format: "Formato do TensorFlow.js: topologia em model.json mais pesos binários em partes de cerca de 4 MB."
chip.coreml-format: "Core ML"
desc.coreml-format: "Formato de modelo da Apple para inferência no aparelho; o coremltools quantiza pesos e ativações."
group.precision: "Precisão"
chip.fp32: "fp32"
desc.fp32: "Ponto flutuante de 32 bits: 4 bytes por parâmetro."
chip.fp16: "fp16"
desc.fp16: "Float IEEE de 16 bits com expoente de 5 bits, faixa até ±65.504."
chip.bf16: "bf16"
desc.bf16: "Brain float de 16 bits: a faixa do fp32 com 7 bits de mantissa, logo menos precisão."
chip.int8: "int8"
desc.int8: "Inteiros de 8 bits com escala e ponto zero: valor = escala × (quantizado − ponto zero)."
chip.int4: "int4"
desc.int4: "Pesos de 4 bits: redução de 4× no tamanho em relação ao BF16."
group.method: "Método"
chip.rtn: "RTN"
desc.rtn: "Arredondamento ao mais próximo, o algoritmo de 4 bits padrão do ONNX Runtime, aplicado por bloco."
chip.gptq: "GPTQ"
desc.gptq: "Calibra pesos de 3 a 4 bits de uma vez com informação de segunda ordem; aguenta modelos de 175B."
chip.awq: "AWQ"
desc.awq: "Protege os canais de pesos mais importantes, escolhidos pela ativação."
chip.hqq: "HQQ"
desc.hqq: "Algoritmo de quantização de pesos que o ONNX Runtime oferece ao lado de RTN e GPTQ."
chip.nf4: "NF4"
desc.nf4: "Tipo de 4 bits para pesos de distribuição normal, usado pelo QLoRA."
chip.k-quants: "k-quants"
desc.k-quants: "Formatos de bloco do GGUF com escalas quantizadas; o Q4_K usa 4,5 bits por peso."
chip.qat: "QAT"
desc.qat: "Treina o modelo já sabendo que será quantizado; o Gemma 3 tem versões com QAT."
group.kv-cache: "Cache KV"
chip.kivi: "KIVI (2 bits)"
desc.kivi: "Quantiza o cache KV em 2 bits: 2,6× menos memória de pico, contando os pesos."
layer.run: "Rodar"
decision.run: "Qual runtime, qual limite?"
group.acceleration: "Aceleração"
chip.webgpu: "WebGPU"
desc.webgpu: "Acesso à GPU para computação geral, não só gráficos; nos quatro navegadores principais, com lacunas por plataforma."
chip.webassembly: "WebAssembly"
desc.webassembly: "SIMD e threads rodam na CPU no Chrome, Firefox e Safari; threads pedem isolamento de origem cruzada."
chip.webnn: "WebNN"
desc.webnn: "API de baixo nível para hardware de redes neurais (CPU, GPU, NPU); rascunho que Chrome e Edge testam."
chip.npu: "NPU"
desc.npu: "O WebNN deixa o navegador escolher entre dispositivos de CPU, GPU e NPU."
group.execution: "Execução"
chip.web-worker: "Web Worker"
desc.web-worker: "Roda a inferência fora da thread principal, para a interface não travar."
chip.shared-worker: "Shared Worker"
desc.shared-worker: "Um worker compartilhado por várias abas da mesma origem."
chip.offscreen-doc: "doc. offscreen"
desc.offscreen-doc: "Como uma extensão do Chrome roda trabalho que precisa de DOM, já que o service worker não tem."
group.runtime: "Runtime"
chip.onnxruntime: "ONNX Runtime"
desc.onnxruntime: "Roda modelos ONNX no navegador (WebAssembly, WebGPU, WebNN) e em plataformas nativas."
chip.llamacpp: "llama.cpp"
desc.llamacpp: "Inferência em C/C++ para modelos GGUF, com builds para Android e Metal da Apple."
chip.mlc-runtime: "MLC"
desc.mlc-runtime: "O runtime por trás do WebLLM, que roda modelos compilados em WebGPU."
chip.litert: "LiteRT"
desc.litert: "Runtime do Google para o aparelho, antigo TensorFlow Lite; usado por mais de 250 mil apps."
chip.executorch: "ExecuTorch"
desc.executorch: "Runtime do PyTorch para a borda: Android, iOS, desktop e embarcados, com backends XNNPACK, Core ML e Vulkan."
chip.coreml-runtime: "Core ML"
desc.coreml-runtime: "Framework da Apple para rodar modelos no aparelho da pessoa."
group.cache: "Cache e tamanho"
chip.per-site-cache: "cache por site"
desc.per-site-cache: "O cache HTTP é separado por site, então dois sites não reaproveitam o mesmo arquivo baixado."
chip.cache-api: "Cache API"
desc.cache-api: "O armazenamento que o Chrome recomenda para arquivos de modelo; WebLLM e Transformers.js o usam por padrão."
chip.opfs: "OPFS"
desc.opfs: "Sistema de arquivos privado da origem, com acesso síncrono dentro de workers."
chip.shared-cache: "cache compartilhado (COS)"
desc.shared-cache: "Proposta: pedir o arquivo pelo hash e compartilhá-lo entre sites. Nenhum navegador o tem de forma nativa ainda."
chip.split-download: "baixar em partes"
desc.split-download: "Baixa um modelo grande em partes paralelas e junta tudo no cliente."
chip.resume-download: "retomar download"
desc.resume-download: "Requisições de faixa (Range) permitem pausar e retomar um download."
chip.size-budget: "orçar download"
desc.size-budget: "O download é parâmetros × bytes por parâmetro: 3,08 bi de parâmetros são 6,2 GB em bf16 e 1,7 GB em int4."
group.memory: "Memória"
chip.wasm-4gb: "4 GB no wasm"
desc.wasm-4gb: "A memória do WebAssembly de 32 bits chega no máximo a 4 GB."
chip.file-2gb: "arquivo de 2 GB"
desc.file-2gb: "Arquivos acima de 2 GB esbarram nos limites de ArrayBuffer e protobuf; o ONNX usa arquivos de dados externos."
chip.buffer-256mb: "buffer de 256 MB"
desc.buffer-256mb: "O maxBufferSize padrão do WebGPU é 256 MB (binding de armazenamento, 128 MB); dá para pedir mais."
chip.kv-grows: "cache KV cresce"
desc.kv-grows: "O cache KV cresce a cada token: cerca de 72 KiB por token no SmolLM3-3B em fp16."
group.gpu: "GPU"
chip.no-shader-f16: "sem shader-f16"
desc.no-shader-f16: "O recurso shader-f16 é opcional, então kernels de meia precisão podem não estar disponíveis."
chip.device-lost: "device lost"
desc.device-lost: "O dispositivo de GPU pode ser perdido; trate a promessa lost e se recupere."
chip.raise-limits: "subir limite"
desc.raise-limits: "Peça limites maiores com requiredLimits ao pedir o dispositivo."
chip.availability: "disponibilidade"
desc.availability: "A disponibilidade do WebGPU varia por navegador e plataforma."
group.disk: "Disco e rede"
chip.origin-quota: "cota da origem"
desc.origin-quota: "Os navegadores gerenciam o armazenamento por origem; a cota depende do motor e do disco."
chip.eviction: "despejo"
desc.eviction: "Dados guardados podem ser despejados, os menos usados primeiro, a menos que a origem peça persistência."
chip.persist: "persist()"
desc.persist: "navigator.storage.persist() pede ao navegador que não despeje os dados da sua origem."
group.isolation: "Isolamento"
chip.coop-coep: "COOP e COEP"
desc.coop-coep: "O isolamento de origem cruzada é necessário para threads de WebAssembly."
where.browser.name: "Navegador"
where.browser.desc: "desktop e celular, extensão, PWA, WebView"
where.desktop.name: "Desktop"
where.desktop.desc: "Electron, Tauri, Node"
where.mobile.name: "Celular"
where.mobile.desc: "app iOS e Android"
where.edge.name: "Borda"
where.edge.desc: "Raspberry Pi, Jetson, Coral, microcontroladores"
panel.limits: "Limites"
layer.integrate: "Integrar no app"
decision.integrate: "E se não houver GPU?"
group.web-library: "Biblioteca web"
chip.ort-web: "ONNX Runtime Web"
desc.ort-web: "ONNX Runtime para o navegador, com backends WebGPU, WebAssembly e WebNN."
chip.transformersjs: "Transformers.js"
desc.transformersjs: "Biblioteca JavaScript da Hugging Face; guarda os modelos na Cache API por padrão."
chip.webllm: "WebLLM"
desc.webllm: "Motor de LLM no navegador sobre WebGPU, com suporte a extensões do Chrome e vários backends de cache."
chip.wllama: "wllama"
desc.wllama: "Bindings de WebAssembly para o llama.cpp; divida os modelos em partes de até 512 MB."
chip.tfjs: "TensorFlow.js"
desc.tfjs: "Aprendizado de máquina em JavaScript, no navegador e no Node."
chip.litertjs: "LiteRT.js"
desc.litertjs: "LiteRT para a web, do Google AI Edge."
chip.mast-ai: "MAST"
desc.mast-ai: "Biblioteca TypeScript que roda o laço do agente no navegador, com ferramentas escritas como funções comuns."
chip.web-ai-sdk: "web-ai-sdk"
desc.web-ai-sdk: "SDK TypeScript com um pacote por API de IA embutida do navegador (Prompt, Summarizer, Translator, WebMCP e outras)."
chip.s1s2: "s1s2.js"
desc.s1s2: "Decisões tipadas (predicate, choice, score) numa só passada de um modelo pequeno no navegador; o README diz alpha."
group.packaging: "Empacotamento"
chip.extension: "extensão"
desc.extension: "Extensões de navegador podem rodar modelos; o WebLLM tem suporte a extensões do Chrome."
chip.pwa: "PWA"
desc.pwa: "Apps web instaláveis que continuam funcionando offline."
group.experience: "Experiência"
chip.loading-screen: "tela de carga"
desc.loading-screen: "Avise que o modelo está baixando; o Chrome documenta como informar o usuário."
chip.no-gpu-fallback: "plano B sem GPU"
desc.no-gpu-fallback: "O WebGPU ainda é experimental em alguns navegadores; um caminho em WebAssembly roda onde ele falha."
chip.structured-output: "saída estruturada"
desc.structured-output: "A decodificação restrita por gramática força JSON válido ou outro formato."
group.browser-api: "API do navegador"
chip.prompt-api: "Prompt API (Gemini Nano)"
desc.prompt-api: "Use um modelo que o navegador baixa e gerencia por você; o estado varia por contexto, veja a página."
chip.summarizer: "Summarizer"
desc.summarizer: "API embutida do navegador que resume texto; o navegador gerencia o modelo."
chip.translator: "Translator"
desc.translator: "API embutida do navegador que traduz texto; o navegador gerencia o modelo."
group.native-sdk: "SDK nativo"
chip.aicore: "AICore (Gemini Nano)"
desc.aicore: "Serviço do sistema Android que roda o Gemini Nano e mantém o modelo atualizado."
chip.foundation-models: "Foundation Models"
desc.foundation-models: "Acesso da Apple aos modelos no aparelho e no Private Cloud Compute, com geração guiada e chamada de ferramentas."
chip.mlkit-genai: "ML Kit GenAI"
desc.mlkit-genai: "As APIs GenAI do ML Kit no Android usam o AICore e processam os dados localmente."
chip.mediapipe: "MediaPipe"
desc.mediapipe: "A LLM Inference API do MediaPipe: as versões de Android e iOS estão descontinuadas em favor do LiteRT-LM; a Web não está."
chip.litert-lm: "LiteRT-LM"
desc.litert-lm: "LLMs em Linux, macOS, Windows e Raspberry Pi por linha de comando; suporta decodificação especulativa."
group.agent-tools: "Ferramentas de agente"
chip.webmcp: "WebMCP"
desc.webmcp: "Páginas registram ferramentas que agentes do navegador podem chamar pelo document.modelContext; rascunho de um Community Group do W3C."
chip.mcp-b: "MCP-B"
desc.mcp-b: "Polyfill do document.modelContext que conecta as ferramentas WebMCP das páginas a clientes do Model Context Protocol; projeto da comunidade."
layer.evaluate: "Avaliar e testar"
decision.evaluate: "Decide igual ao original?"
group.quality: "Qualidade"
chip.fidelity: "fidelidade"
desc.fidelity: "A quantização pode degradar o desempenho, então meça o modelo quantizado contra o original."
chip.op-coverage: "operadores"
desc.op-coverage: "WebGPU, WebGL e WebNN suportam só parte dos operadores ONNX; o WebAssembly suporta todos."
chip.tool-calling-evals: "testes de ferramentas"
desc.tool-calling-evals: "Confira se o agente escolhe a ferramenta e os argumentos certos; o WebMCP Evals compara as chamadas com as esperadas."
group.performance: "Desempenho"
chip.energy-battery: "bateria"
desc.energy-battery: "Artigos medem a energia em celulares; ainda não há uma medida comparável e consolidada."
chip.background-tab: "segundo plano"
desc.background-tab: "Abas em segundo plano são limitadas; os timers ficam mais lentos a partir do Chrome 88."
