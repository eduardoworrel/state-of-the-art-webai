alert.onnxruntime: "On 2026-11-20 github.com/microsoft/onnxruntime answers 404, on the web and in the GitHub API; so do onnxruntime-genai and onnxruntime-extensions. PyPI onnxruntime 1.32.0 (2026-11-13), npm onnxruntime-web 1.31.1 and onnxruntime.ai still point to that address. No new address found: github.com/onnxruntime/onnxruntime also answers 404. The documentation site and the package registries still answer."
alert.ort-web: "On 2026-11-20 the repository listed by npm for onnxruntime-web 1.31.1 (published 2026-10-26), github.com/Microsoft/onnxruntime, answers 404, on the web and in the GitHub API. No new address found. The documentation site and the npm registry still answer."
alert.mediapipe: "The official page of the LLM Inference API, archived on 2026-05-17, says its Android and iOS implementations are deprecated, that Web is not, and asks mobile projects to migrate to LiteRT-LM. In the archive the notice is absent on 2026-03-30 and present on 2026-04-05. On 2026-11-20 the page address redirects (301) to the LiteRT-LM page."
group.quant-tools: "Quantize with"
group.export-tools: "Export with"
ui.also: "Also exists (not drawn on the figure)"
chip.ort-genai: "ONNX Runtime GenAI"
desc.ort-genai: "The generative AI loop for ONNX models: tokenization, search and sampling, KV cache management and a generate() API, in preview."
chip.litert-lm-runtime: "LiteRT-LM"
desc.litert-lm-runtime: "Google's orchestration layer to run LLMs with LiteRT: cross-platform, with a command-line tool and Python, Kotlin, Swift, Web and C++ APIs."
chip.mnn-llm: "MNN-LLM"
desc.mnn-llm: "The LLM module of Alibaba's MNN inference engine: it exports PyTorch models to MNN and runs text generation; MNN ships Android chat apps."
chip.executorch-llm: "ExecuTorch LLM"
desc.executorch-llm: "ExecuTorch's building blocks for local LLMs: quantized text models, long context, tool calling, speculative decoding, a local server."
chip.candle: "Candle"
desc.candle: "Hugging Face's minimalist Rust ML framework; its online demos run LLaMA2 and T5 text generation entirely in the browser."
chip.burn: "Burn"
desc.burn: "A Rust deep-learning framework whose backends include WebGPU and a no_std CPU backend."
chip.optimum: "Optimum"
desc.optimum: "Hugging Face's toolkit to export and optimize models; the Transformers.js docs recommend it to convert PyTorch models to ONNX."
chip.olive: "Olive"
desc.olive: "Microsoft's toolkit for the ONNX Runtime: model conversion, quantization and optimization for CPUs, GPUs and NPUs."
chip.ort-genai-builder: "GenAI Model Builder"
desc.ort-genai-builder: "The ONNX Runtime GenAI tool that builds an ONNX model for the generate() API from Hugging Face weights, in the precision you choose."
chip.mlc-compile: "MLC compile"
desc.mlc-compile: "Converts weights to the MLC format and compiles the model library so a model runs on the platform you target."
chip.litert-torch: "litert-torch"
desc.litert-torch: "Converts PyTorch models to LiteRT for on-device inference."
chip.coremltools-export: "coremltools"
desc.coremltools-export: "Apple's tools to convert and edit models for Core ML, with weight and activation quantization."
chip.executorch-export: "ExecuTorch export"
desc.executorch-export: "Captures a PyTorch model with torch.export, optimizes it for the target hardware and produces an ExecuTorch program."
chip.llama-quantize: "llama.cpp quantize"
desc.llama-quantize: "Takes a GGUF model in a high-precision type (F32, BF16) and converts it to a quantized type; an imatrix file can limit the accuracy loss."
chip.autogptq: "AutoGPTQ"
desc.autogptq: "A GPTQ quantization package; its README says it is unmaintained and suggests GPTQModel, and the repository is archived."
chip.autoawq: "AutoAWQ"
desc.autoawq: "An AWQ quantization package; its README says it is officially deprecated and points to llm-compressor."
chip.llm-compressor: "llm-compressor"
desc.llm-compressor: "The vLLM project's library to compress LLMs for production inference; AutoAWQ's README says vLLM adopted AutoAWQ there."
chip.bitsandbytes: "bitsandbytes"
desc.bitsandbytes: "k-bit quantization for PyTorch, with the 8-bit and 4-bit (NF4) types that QLoRA uses."
chip.torchao: "torchao"
desc.torchao: "PyTorch-native quantization and training optimization; its README says new feature development is minimized."
alert.ort-genai: "On 2026-11-20 github.com/microsoft/onnxruntime-genai answers 404, on the web and in the GitHub API, like the other ONNX Runtime repositories. The documentation at onnxruntime.ai still links to it and says the API is in preview; PyPI onnxruntime-genai 0.20.0 (2026-11-14) still answers. No new address found."
alert.ort-genai-builder: "On 2026-11-20 the page \"Generate models using Model Builder\" only points to the model builder guide at github.com/microsoft/onnxruntime-genai, which answers 404 (the whole repository does, on the web and in the GitHub API). The Phi-2 tutorial on onnxruntime.ai still describes the builder command. No new address found."
alert.olive: "On 2026-11-20 github.com/microsoft/Olive answers 404, on the web and in the GitHub API. The documentation site microsoft.github.io/Olive and PyPI olive-ai 0.13.0 (2026-06-09) still answer, and PyPI still links to that repository. No new address found."
alert.optimum: "The Optimum README, read on 2026-11-20, says the ONNX integration was moved to optimum-onnx, which has its own installation instructions."
alert.litert-torch: "On 2026-11-20 github.com/google-ai-edge/ai-edge-torch redirects (301) to github.com/google-ai-edge/litert-torch."
alert.autogptq: "The AutoGPTQ README, read on 2026-11-20, begins: “AutoGPTQ is unmaintained - we suggest using GPTQModel for bug fixes and new models support”. The GitHub API reports the repository as archived (last push 2025-04-11)."
alert.autoawq: "The AutoAWQ README, read on 2026-11-20, says: “AutoAWQ is officially deprecated and will no longer be maintained.” and that the vLLM project adopted it as llm-compressor. The GitHub API reports the repository as archived (last push 2025-05-11)."
