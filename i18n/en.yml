group.start: "Starting point"
chip.open-weights: "open weights"
desc.open-weights: "Weights published openly, so they can be adapted, converted and shipped; SmolLM3-3B is Apache-2.0."
chip.short-context: "short context"
desc.short-context: "A short context keeps the KV cache small; the cache grows with every token kept."
group.adapt: "Adapt"
chip.lora: "LoRA"
desc.lora: "Freezes the base weights and trains small low-rank matrices, with no extra latency at inference."
chip.qlora: "QLoRA"
desc.qlora: "LoRA on a model frozen in 4 bits; fine-tunes a 65B model on a single 48 GB GPU."
chip.distillation: "distillation"
desc.distillation: "Squeezes a larger model into a smaller one; DistilBERT is 40% smaller and 60% faster."
layer.convert: "Convert and quantize"
decision.convert: "How low can I go?"
group.format: "Format"
chip.onnx: "ONNX"
desc.onnx: "Open graph format that ONNX Runtime executes in the browser and natively."
chip.gguf: "GGUF"
desc.gguf: "File format for GGML-based runtimes, designed for fast loading with mmap."
chip.mlc-format: "MLC"
desc.mlc-format: "Model packaging used by MLC and WebLLM to run on WebGPU."
chip.tflite: ".tflite"
desc.tflite: "Model format of LiteRT, formerly TensorFlow Lite, for on-device inference."
chip.coreml-format: "Core ML"
desc.coreml-format: "Apple's model format for on-device inference; coremltools quantizes weights and activations."
group.precision: "Precision"
chip.fp32: "fp32"
desc.fp32: "32-bit floating point: 4 bytes per parameter."
chip.fp16: "fp16"
desc.fp16: "16-bit IEEE float with a 5-bit exponent, range up to ±65,504."
chip.bf16: "bf16"
desc.bf16: "16-bit brain float: fp32's range with 7 mantissa bits, so less precision."
chip.int8: "int8"
desc.int8: "8-bit integers with a scale and zero point: value = scale × (quantized − zero point)."
chip.int4: "int4"
desc.int4: "4-bit weights: a 4× reduction in size compared with BF16."
group.method: "Method"
chip.rtn: "RTN"
desc.rtn: "Round-to-nearest, the default 4-bit algorithm in ONNX Runtime, applied block by block."
chip.gptq: "GPTQ"
desc.gptq: "Calibrates 3 to 4 bit weights in one shot with second-order information; handles 175B models."
chip.awq: "AWQ"
desc.awq: "Protects the most important weight channels, chosen by activations."
chip.hqq: "HQQ"
desc.hqq: "A weight quantization algorithm ONNX Runtime offers next to RTN and GPTQ."
chip.nf4: "NF4"
desc.nf4: "4-bit type for normally distributed weights, used by QLoRA."
chip.k-quants: "k-quants"
desc.k-quants: "GGUF block formats with quantized scales; Q4_K uses 4.5 bits per weight."
chip.qat: "QAT"
desc.qat: "Trains the model already knowing it will be quantized; Gemma 3 ships QAT versions."
group.kv-cache: "KV cache"
chip.kivi: "KIVI (2 bits)"
desc.kivi: "Quantizes the KV cache to 2 bits: 2.6× less peak memory, including the weights."
layer.run: "Run"
decision.run: "Which accelerator, which limit?"
group.acceleration: "Acceleration"
chip.webgpu: "WebGPU"
desc.webgpu: "GPU access for general computation, not only graphics; in the four major browsers, with platform gaps."
chip.webassembly: "WebAssembly"
desc.webassembly: "SIMD and threads run on the CPU in Chrome, Firefox and Safari; threads need cross-origin isolation."
chip.webnn: "WebNN"
desc.webnn: "Low-level API for neural-network hardware (CPU, GPU, NPU); a draft that Chrome and Edge are testing."
chip.npu: "NPU"
desc.npu: "WebNN lets the browser choose among CPU, GPU and NPU devices."
group.execution: "Execution"
chip.web-worker: "Web Worker"
desc.web-worker: "Runs inference off the main thread so the interface does not freeze."
chip.shared-worker: "Shared Worker"
desc.shared-worker: "One worker shared by several tabs of the same origin."
chip.offscreen-doc: "offscreen doc"
desc.offscreen-doc: "How a Chrome extension runs work that needs a DOM, since its service worker has none."
group.runtime: "Runtime"
chip.onnxruntime: "ONNX Runtime"
desc.onnxruntime: "Runs ONNX models in the browser (WebAssembly, WebGPU, WebNN) and natively."
chip.llamacpp: "llama.cpp"
desc.llamacpp: "C/C++ inference for GGUF models, with Android and Apple Metal builds."
chip.mlc-runtime: "MLC"
desc.mlc-runtime: "The runtime behind WebLLM, running compiled models on WebGPU."
chip.litert: "LiteRT"
desc.litert: "Google's on-device runtime, formerly TensorFlow Lite; used by 250K+ apps."
chip.executorch: "ExecuTorch"
desc.executorch: "PyTorch runtime for the edge: Android, iOS, desktop and embedded, with XNNPACK, Core ML and Vulkan backends."
chip.coreml-runtime: "Core ML"
desc.coreml-runtime: "Apple's framework for running models on a person's device."
group.cache: "Cache and size"
chip.per-site-cache: "per-site cache"
desc.per-site-cache: "The HTTP cache is keyed by site, so two sites cannot reuse one downloaded file."
chip.cache-api: "Cache API"
desc.cache-api: "Chrome's recommended store for model files; WebLLM and Transformers.js use it by default."
chip.opfs: "OPFS"
desc.opfs: "Origin private file system: private storage with synchronous access inside workers."
chip.shared-cache: "shared cache (COS)"
desc.shared-cache: "Proposal: ask for a file by its hash and share it across sites. No browser ships it natively yet."
chip.split-download: "split download"
desc.split-download: "Download a large model in parallel chunks and stitch them together on the client."
chip.resume-download: "resume download"
desc.resume-download: "Range requests let a download pause and resume."
chip.size-budget: "size budget"
desc.size-budget: "Download size is parameters × bytes per parameter: 3.08B parameters is 6.2 GB in bf16 and 1.7 GB in int4."
group.memory: "Memory"
chip.wasm-4gb: "4 GB in wasm"
desc.wasm-4gb: "32-bit WebAssembly memory tops out at 4 GB."
chip.file-2gb: "2 GB file"
desc.file-2gb: "Files above 2 GB hit ArrayBuffer and protobuf limits; ONNX uses external data files."
chip.buffer-256mb: "256 MB buffer"
desc.buffer-256mb: "WebGPU's default maxBufferSize is 256 MB (storage binding 128 MB); more can be requested."
chip.kv-grows: "KV cache grows"
desc.kv-grows: "The KV cache grows with every token: about 72 KiB per token for SmolLM3-3B in fp16."
group.gpu: "GPU"
chip.no-shader-f16: "no shader-f16"
desc.no-shader-f16: "The shader-f16 feature is optional, so half-precision kernels may be unavailable."
chip.device-lost: "device lost"
desc.device-lost: "The GPU device can be lost; handle the lost promise and recover."
chip.raise-limits: "raise limits"
desc.raise-limits: "Ask for higher limits with requiredLimits when requesting the device."
chip.availability: "availability"
desc.availability: "WebGPU availability varies by browser and platform."
group.disk: "Disk and network"
chip.origin-quota: "origin quota"
desc.origin-quota: "Browsers manage storage per origin; the quota depends on the engine and the disk."
chip.eviction: "eviction"
desc.eviction: "Stored data can be evicted, least recently used first, unless the origin asked for persistence."
chip.persist: "persist()"
desc.persist: "navigator.storage.persist() asks the browser not to evict your origin's data."
group.isolation: "Isolation"
chip.coop-coep: "COOP and COEP"
desc.coop-coep: "Cross-origin isolation is required for WebAssembly threads."
