group.web-library: "Web library"
chip.ort-web: "ONNX Runtime Web"
desc.ort-web: "ONNX Runtime for the browser, with WebGPU, WebAssembly and WebNN backends."
chip.transformersjs: "Transformers.js"
desc.transformersjs: "Hugging Face's JavaScript library; caches models with the Cache API by default."
chip.webllm: "WebLLM"
desc.webllm: "In-browser LLM engine on WebGPU, with Chrome extension support and several cache backends."
chip.wllama: "wllama"
desc.wllama: "WebAssembly bindings for llama.cpp; split models into chunks of up to 512 MB."
chip.tfjs: "TensorFlow.js"
desc.tfjs: "Machine learning in JavaScript, in the browser and in Node."
chip.litertjs: "LiteRT.js"
desc.litertjs: "LiteRT for the web, from Google AI Edge."
group.packaging: "Packaging"
chip.extension: "extension"
desc.extension: "Browser extensions can run models; WebLLM supports Chrome extensions."
chip.pwa: "PWA"
desc.pwa: "Installable web apps that keep working offline."
group.experience: "Experience"
chip.loading-screen: "loading screen"
desc.loading-screen: "Tell people the model is downloading; Chrome documents how to inform users."
chip.no-gpu-fallback: "no-GPU fallback"
desc.no-gpu-fallback: "WebGPU is experimental in some browsers; a WebAssembly path can run where it fails."
chip.structured-output: "structured output"
desc.structured-output: "Grammar-constrained decoding forces valid JSON or another format."
group.browser-api: "Browser API"
chip.prompt-api: "Prompt API (Gemini Nano)"
desc.prompt-api: "Prompt a model the browser downloads and manages for you; status varies by context, see the page."
chip.summarizer: "Summarizer"
desc.summarizer: "Built-in browser API that summarizes text; the browser manages the model."
chip.translator: "Translator"
desc.translator: "Built-in browser API that translates text; the browser manages the model."
group.native-sdk: "Native SDK"
chip.aicore: "AICore (Gemini Nano)"
desc.aicore: "Android system service that runs Gemini Nano and keeps the model up to date."
chip.foundation-models: "Foundation Models"
desc.foundation-models: "Apple's access to on-device and Private Cloud Compute models, with guided generation and tool calling."
chip.mlkit-genai: "ML Kit GenAI"
desc.mlkit-genai: "ML Kit GenAI APIs on Android use AICore and process data locally."
chip.mediapipe: "MediaPipe"
desc.mediapipe: "MediaPipe's LLM Inference API: its Android and iOS versions are deprecated in favor of LiteRT-LM; Web is not."
chip.litert-lm: "LiteRT-LM"
desc.litert-lm: "LLMs on Linux, macOS, Windows and Raspberry Pi through a CLI; supports speculative decoding."
layer.evaluate: "Evaluate and test"
decision.evaluate: "Same as the original?"
group.quality: "Quality"
chip.fidelity: "fidelity"
desc.fidelity: "Quantization can degrade performance, so measure the quantized model against the original."
chip.op-coverage: "operator coverage"
desc.op-coverage: "WebGPU, WebGL and WebNN support only a subset of ONNX operators; WebAssembly supports all."
group.performance: "Performance"
chip.energy-battery: "battery"
desc.energy-battery: "Papers measure phone energy; no comparable, agreed measurement exists yet."
chip.background-tab: "background tab"
desc.background-tab: "Background tabs are throttled; timers slow down in Chrome 88 and later."
